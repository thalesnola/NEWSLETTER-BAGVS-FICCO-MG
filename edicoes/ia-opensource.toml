# Edicao: IA e open source. Copie este arquivo para criar outra newsletter.
nome = "ia-opensource"
titulo = "Radar IA & Open Source"
descricao = "Lançamentos de IA, ferramentas open source e releases que importam."
cor = "#5b5bd6"            # cor de destaque do painel
janela_horas = 30          # so entram itens publicados nas ultimas N horas
max_itens = 80             # teto enviado a IA (distribuido entre fontes por peso)
destaques = 5
# Temas em que a IA classifica cada item (fora da lista vira "Outros").
temas = ["Modelos e laboratórios", "Ferramentas e agentes", "Open source e releases", "Mercado e regulação", "Pesquisa"]
# Pedido editorial: o que importa e o que descartar.
foco = """
Leitor: analista técnico que usa Claude Code, Ollama e agentes no dia a dia.
Priorize: lançamento de modelo, release com mudança relevante, ferramenta nova utilizável, mudança de preço/limite.
Descarte: opinião sem fato novo, listas genéricas, promoção.
"""
